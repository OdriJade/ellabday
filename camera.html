<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Album</title>
    <link rel="stylesheet" href="shared.css" />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>

<body>
    <h1>📷 Take a Photo</h1>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div>
        <button class="btn" id="captureBtn">Take Photo</button>
        <button class="btn" id="switchCameraBtn">🔄 Switch Camera</button>
        <button class="btn" id="uploadBtn">🖼️ Upload Photo</button>
        <input type="file" id="uploadInput" accept="image/*" style="display:none;" />
    </div>
    <p id="statusText"></p>

    <h2>Album</h2>
    <div class="album-grid" id="albumGrid"></div>

    <a class="back-link" href="page2.html">&larr; Back</a>

    <!-- Modal for viewing a photo large -->
    <div class="modal-overlay" id="modalOverlay">
        <span class="close-modal" id="closeModal">&times;</span>
        <img id="modalImg" src="" alt="photo" />
        <div class="modal-caption">
            <div class="caption-bubble" id="captionBubble">
                <p id="captionDisplay" class="caption-text"></p>
                <p id="captionEmpty" class="caption-empty">No message yet — add one below.</p>
            </div>
            <textarea id="captionInput" placeholder="Write a message on this photo..."></textarea>
            <button class="btn" id="saveCaptionBtn" style="margin-top:10px;">Save Message</button>
            <button class="btn btn-danger" id="deletePhotoBtn" style="margin-top:10px;">Delete Photo</button>
        </div>
    </div>

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const captureBtn = document.getElementById("captureBtn");
        const switchCameraBtn = document.getElementById("switchCameraBtn");
        const uploadBtn = document.getElementById("uploadBtn");
        const uploadInput = document.getElementById("uploadInput");
        const statusText = document.getElementById("statusText");
        const albumGrid = document.getElementById("albumGrid");
        const modalOverlay = document.getElementById("modalOverlay");
        const modalImg = document.getElementById("modalImg");
        const captionInput = document.getElementById("captionInput");
        const captionDisplay = document.getElementById("captionDisplay");
        const captionEmpty = document.getElementById("captionEmpty");
        const saveCaptionBtn = document.getElementById("saveCaptionBtn");
        const deletePhotoBtn = document.getElementById("deletePhotoBtn");
        const closeModal = document.getElementById("closeModal");

        let currentPhotoId = null;
        let currentStream = null;
        let facingMode = "user"; // "user" = front/selfie camera, "environment" = back camera
        const MAX_WIDTH = 800; // resize photos down so they fit comfortably in a Firestore document

        function startCamera(mode) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                video.outerHTML = "<p>Camera not available. This page must be opened via localhost or HTTPS, not by double-clicking the file.</p>";
                return;
            }

            // Stop any existing stream before starting a new one
            if (currentStream) {
                currentStream.getTracks().forEach((track) => track.stop());
            }

            navigator.mediaDevices.getUserMedia({ video: { facingMode: mode } })
                .then((stream) => {
                    currentStream = stream;
                    video.srcObject = stream;
                    video.classList.toggle("mirrored", mode === "user");
                })
                .catch((err) => {
                    console.error(err);
                    statusText.textContent = "Couldn't access that camera. Your device may only have one, or permission was denied.";
                });
        }

        startCamera(facingMode);

        switchCameraBtn.addEventListener("click", () => {
            facingMode = facingMode === "user" ? "environment" : "user";
            startCamera(facingMode);
        });

        // Live updates: renders automatically whenever ANY visitor adds/edits a photo
        db.collection("photos").orderBy("createdAt", "asc").onSnapshot((snapshot) => {
            albumGrid.innerHTML = "";
            snapshot.forEach((doc) => {
                const photo = doc.data();
                const item = document.createElement("div");
                item.className = "album-item";

                const imgWrap = document.createElement("div");
                imgWrap.className = "album-item-img";
                const img = document.createElement("img");
                img.src = photo.src;
                imgWrap.appendChild(img);
                item.appendChild(imgWrap);

                const captionBar = document.createElement("div");
                captionBar.className = "album-item-caption";
                if (photo.caption && photo.caption.trim()) {
                    const preview = photo.caption.length > 18
                        ? photo.caption.slice(0, 18) + "..."
                        : photo.caption;
                    captionBar.innerHTML = `${escapeHtml(preview)} <span class="see-more">See more</span>`;
                }
                item.appendChild(captionBar);

                item.addEventListener("click", () => openModal(doc.id, photo));
                albumGrid.appendChild(item);
            });
        }, (err) => {
            console.error(err);
            statusText.textContent = "Couldn't load album. Check your Firebase config in firebase-config.js.";
        });

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str;
            return div.innerHTML;
        }

        function savePhoto(dataUrl) {
            statusText.textContent = "Uploading...";
            db.collection("photos").add({
                src: dataUrl,
                caption: "",
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                statusText.textContent = "Photo added!";
                setTimeout(() => statusText.textContent = "", 2000);
            }).catch((err) => {
                console.error(err);
                statusText.textContent = "Upload failed. Check your Firebase config/rules.";
            });
        }

        captureBtn.addEventListener("click", () => {
            const scale = Math.min(1, MAX_WIDTH / video.videoWidth);
            canvas.width = video.videoWidth * scale;
            canvas.height = video.videoHeight * scale;
            const ctx = canvas.getContext("2d");
            if (facingMode === "user") {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            savePhoto(canvas.toDataURL("image/jpeg", 0.6));
        });

        uploadBtn.addEventListener("click", () => {
            uploadInput.click();
        });

        uploadInput.addEventListener("change", () => {
            const file = uploadInput.files[0];
            if (!file) return;

            const img = new Image();
            const objectUrl = URL.createObjectURL(file);
            img.onload = () => {
                const scale = Math.min(1, MAX_WIDTH / img.width);
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
                savePhoto(canvas.toDataURL("image/jpeg", 0.6));
                URL.revokeObjectURL(objectUrl);
                uploadInput.value = ""; // reset so the same file can be picked again later
            };
            img.onerror = () => {
                statusText.textContent = "Couldn't read that image file.";
                URL.revokeObjectURL(objectUrl);
            };
            img.src = objectUrl;
        });

        function openModal(id, photo) {
            currentPhotoId = id;
            modalImg.src = photo.src;
            captionInput.value = photo.caption || "";
            updateCaptionBubble(photo.caption || "");
            modalOverlay.classList.add("visible");
        }

        function updateCaptionBubble(caption) {
            if (caption && caption.trim()) {
                captionDisplay.textContent = caption;
                captionDisplay.style.display = "block";
                captionEmpty.style.display = "none";
            } else {
                captionDisplay.style.display = "none";
                captionEmpty.style.display = "block";
            }
        }

        saveCaptionBtn.addEventListener("click", () => {
            db.collection("photos").doc(currentPhotoId).update({
                caption: captionInput.value
            }).then(() => {
                updateCaptionBubble(captionInput.value);
            }).catch((err) => {
                console.error(err);
                alert("Couldn't save message. Please try again.");
            });
        });

        closeModal.addEventListener("click", () => {
            modalOverlay.classList.remove("visible");
        });

        deletePhotoBtn.addEventListener("click", () => {
            if (!confirm("Delete this photo? This can't be undone.")) return;
            db.collection("photos").doc(currentPhotoId).delete()
                .then(() => {
                    modalOverlay.classList.remove("visible");
                })
                .catch((err) => {
                    console.error(err);
                    alert("Couldn't delete photo. Please try again.");
                });
        });
    </script>
</body>

</html>
