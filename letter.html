<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Letter For You</title>
    <link rel="stylesheet" href="shared.css" />
</head>

<body>
    <h1>✉️ A Letter For You</h1>
    <p>This letter can only be opened with the password.</p>

    <div class="password-form" id="passwordForm">
        <input type="password" id="passwordInput" placeholder="Enter password" />
        <button class="btn" id="unlockBtn">Unlock</button>
    </div>
    <div class="error-text" id="errorText">Incorrect password. Try again.</div>

    <div class="letter-box" id="letterBox" style="display:none;"></div>

    <a class="back-link" href="page2.html">&larr; Back</a>

    <script>
        // EDIT THESE TWO VALUES:
        const PASSWORD = "odella";
        const LETTER_TEXT = `My Dearest El,

Hello, my love, it's your birthday, and I want nothing but for you to enjoy this day. 

I know you’ve been struggling with many things lately, but I want you to know that there are a lot of people who support you and will always be with you. I will always be with you no matter what. 

You are the most amazing person I have ever met. I'm really glad to be loved by you. You gave me so much and taught me a lot. 
I hope you know how much I love you. I hope you know how important you are to me, so please don't doubt my love and care for you. 
I know this gift is small; I'll buy it once maka earn nakog money. 
I know you'll appreciate these things even if they're not big; that's how genuine you are.

I love you so much, my love. I'm here for you, okay! Things will get better; I believe


Love,
Audrey`;

        const passwordInput = document.getElementById("passwordInput");
        const unlockBtn = document.getElementById("unlockBtn");
        const errorText = document.getElementById("errorText");
        const letterBox = document.getElementById("letterBox");
        const passwordForm = document.getElementById("passwordForm");

        unlockBtn.addEventListener("click", checkPassword);
        passwordInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") checkPassword();
        });

        function checkPassword() {
            if (passwordInput.value === PASSWORD) {
                letterBox.textContent = LETTER_TEXT;
                letterBox.style.display = "block";
                passwordForm.style.display = "none";
                errorText.style.display = "none";
            } else {
                errorText.style.display = "block";
            }
        }
    </script>
</body>

</html>
